<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a8adb0">
  <meta name="description" content="Sign in to your Stackly Home account.">
  <title>Log In — STACKLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<script src="js/animations.js"></script>
<script src="js/email-validation.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="auth-page login-page">
  <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5"></path><path d="m10.5 6.5L5 12l5.5 5.5"></path></g></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path></symbol>
    <symbol id="i-facebook" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"></path></symbol>
  </svg>
  <main class="auth-layout">
    <section class="auth-card login-card" aria-labelledby="login-heading">
      <a class="auth-logo" href="index.html" aria-label="Stackly home"><img src="Assets/logo.webp" alt="STACKLY"></a>

      <nav class="auth-tabs" aria-label="Account">
        <a class="auth-tab is-active" href="signin.html" aria-current="page">Log In</a>
        <a class="auth-tab" href="signup.html">Sign Up</a>
      </nav>

      <div class="auth-intro">
        <h1 id="login-heading">Welcome back.</h1>
        <p>Log in to continue to your account.</p>
      </div>

      <div class="auth-role" role="radiogroup" aria-label="Choose account type">
        <label class="role-option"><input type="radio" name="role" value="User" checked><span>User</span></label>
        <label class="role-option"><input type="radio" name="role" value="Admin"><span>Admin</span></label>
      </div>

      <form class="auth-form" data-auth-form="login">
        <label class="visually-hidden" for="login-email">Email address</label>
        <input id="login-email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
        <label class="visually-hidden" for="login-password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <div class="form-options">
          <label class="remember-option"><input type="checkbox" name="remember"> <span>Remember me</span></label>
          <button class="text-button" type="button" data-reset-notice>Forgot password?</button>
        </div>
        <button class="submit-button login-submit" type="submit">Log In</button>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
      </form>

      <p class="account-prompt">New to Stackly? <a href="signup.html">Create account</a></p>

      <a class="back-button login-back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-left"></use></svg> Back</a>

      <div class="social-divider"><span>Instant Login</span></div>
      <div class="social-actions" aria-label="Other sign-in options">
        <button class="social-button" type="button" data-social-notice="Google">
          <span class="social-icon google-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-google"></use></svg></span> Continue with Google
        </button>
        <button class="social-button" type="button" data-social-notice="Facebook">
          <span class="social-icon facebook-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-facebook"></use></svg></span> Continue with Facebook
        </button>
      </div>
    </section>

    <aside class="auth-promo login-promo" aria-label="Stackly Home">
      <p>Your account</p>
      <h2>Make space for<br>beautiful living.</h2>
    </aside>
  </main>
</body>
</html>
